<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060c18">
</head>
<body>
<title>Turnos CTMM</title>
<style>
/* Concepto: sala de control sobre la foto difuminada de la central; la planilla de turnos como hoja clara.
   Un solo aspecto oscuro (decisión de diseño), con colores de turno tomados de la planilla original. */
:root{
  color-scheme:dark;
  --bg:#08111f;
  --m:#7fd096;--t:#f6c453;--n:#89b6ee;--f:#f49cb4;
  --m-i:#0d3b1c;--t-i:#4a3300;--n-i:#0e2b52;--f-i:#5b0f27;
  --panel:rgba(8,16,30,.66);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.11);
  --text:#eef3fa;--muted:#a3b3c8;--accent:#5aa9ff;--accent-i:#04203f;
  --danger:#ff6b81;--ok:#3ddc84;--warn:#ffcf6b;
  --paper:#f4f5f7;--ink:#1f2630;--head:#3a3f47;--hgray:#cfd3d8;--hgray2:#bcc2c9;--today:#e0245e;
  --font:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --font-cond:"Roboto Condensed","sans-serif-condensed","Arial Narrow",Roboto,sans-serif;
  --cell:28px;--lbl:66px;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:15px/1.4 var(--font);color:var(--text);background:var(--bg);overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:0;background:var(--bg) url(bg.jpg) 50% 0/cover no-repeat;pointer-events:none}
@media (orientation:landscape){#bg{background-image:url(bg-wide.jpg);background-position:30% 40%}}
#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,24,.12) 0%,rgba(5,12,24,.28) 35%,rgba(5,12,24,.66) 70%,rgba(5,12,24,.78) 100%)}
.cond{font-family:var(--font-cond)}
.mut{color:var(--muted)}
.sm{font-size:12px}

/* barra superior (en celular la navegación queda fija abajo) */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:14px 16px 12px;background:rgba(5,11,22,.93);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;flex:none}
.brand{min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px;text-wrap:balance}
.brand p{margin:1px 0 0;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--ok)}.sync.saving i{background:var(--warn)}.sync.err i{background:var(--danger)}.sync.ro i{background:var(--accent)}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:12px 16px 100px}
.view{display:none}.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* bases */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.card h2{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cols>.col>.card,.mia>.card{margin:0}
.cols,.col,.mia{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:14px}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-i);font-weight:700}
.btn.dan{color:var(--danger)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.armed{background:var(--danger);color:#fff;border-color:transparent}
.ibtn{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line)}
.ibtn svg{width:20px;height:20px}
.ibtn.sm{width:40px;height:34px;border-radius:10px;font-size:13px;font-weight:700}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.note.warn{color:var(--warn)}.note.ok{color:var(--ok)}
.hint,.foot{font-size:12px;color:var(--muted);text-align:center;margin:10px 4px}
.kbd{display:inline-block;padding:0 5px;border:1px solid var(--line);border-radius:5px;font-size:11px;line-height:17px}

/* fichas de turno */
.k{display:inline-grid;place-items:center;border-radius:6px;font-weight:800;position:relative;line-height:1}
.c-M{background:var(--m);color:var(--m-i)}.c-T{background:var(--t);color:var(--t-i)}
.c-N{background:var(--n);color:var(--n-i)}.c-F{background:var(--f);color:var(--f-i)}
.vac{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.62) 0 3px,transparent 3px 7px)}
.ov:after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#0b1626;box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.crewc{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.crewc.sm{width:32px;height:32px;font-size:15px}
.tagme{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:52px;height:46px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:18px;padding:0 12px}
.chip.on{background:var(--accent);color:var(--accent-i);border-color:transparent}

/* hoy */
.datenav{display:flex;align-items:center;gap:10px}
.datenav .mid{flex:1;text-align:center;min-width:0}
.dname{font-size:13px;color:var(--muted);text-transform:capitalize}
.pick{position:relative;display:inline-block;cursor:pointer}
.dfull{font-size:21px;font-weight:700;border-bottom:1px dashed rgba(255,255,255,.3)}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ttag{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.1em;padding:3px 10px;border-radius:99px;background:rgba(90,169,255,.18);color:var(--accent)}
.nowc{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(61,220,132,.18),rgba(8,16,30,.74));border-color:rgba(61,220,132,.38)}
.nowc .inf{flex:1;min-width:0}
.nowc small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ok)}
.nowc b{display:block;font-size:17px}
.nowc .s{font-size:13px;color:var(--muted)}
.pulse{width:11px;height:11px;flex:none;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.6)}70%{box-shadow:0 0 0 11px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:10px;margin-top:8px;border-radius:14px;background:var(--panel2);border:1px solid transparent;text-align:left}
.srow:first-of-type{margin-top:0}
.srow.me{border-color:rgba(90,169,255,.7);background:rgba(90,169,255,.13)}
.srow .k{width:48px;height:48px;font-size:20px;border-radius:12px;flex:none}
.srow .vac{font-size:15px}
.srow .inf{flex:1;min-width:0}
.srow .inf b{display:block;font-size:16px}
.srow .inf span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .inf .tagme{color:var(--accent)}
.srow.me .crewc{background:var(--accent);color:var(--accent-i);border-color:transparent}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 6px;margin:0 -4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sday{flex:none;width:46px;text-align:center}
.sday small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.sday .k{width:42px;height:42px;font-size:16px;border-radius:10px;margin-top:4px}
.sday .vac{font-size:12px}
.sday.t small{color:var(--text)}
.sday.t .k{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fact{background:var(--panel2);border-radius:12px;padding:10px 12px;min-width:0}
.fact small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.fact b{display:block;font-size:15px;margin-top:2px}
.fact span{font-size:12.5px;color:var(--muted)}
.week{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:5px;align-items:center}
.wh{text-align:center;font-size:11px;color:var(--muted);font-weight:600;line-height:1.25}
.wh b{display:block;color:var(--text);font-size:14px;font-variant-numeric:tabular-nums}
.wh.t b{color:var(--accent)}
.wc{font-weight:800;text-align:center;color:var(--muted)}
.wc.me{color:var(--accent)}
.wk .k{width:100%;height:34px;font-size:14px;border-radius:8px}
.wk .vac{font-size:11px}

/* cronograma */
.yearbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ylab{font-weight:700;font-size:15px}
.yearbox{display:flex;align-items:center;background:#1a2332;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.yearbox button{width:42px;height:42px;display:grid;place-items:center}
.yearbox button svg{width:20px;height:20px}
.yearbox b{min-width:66px;text-align:center;font-size:21px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .k{width:28px;height:22px;font-size:11px;border-radius:5px}
.monthbar{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.monthbar::-webkit-scrollbar{display:none}
.mchip{flex:none;padding:8px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600}
.mchip.cur{border-color:var(--accent);color:var(--accent)}
.paper{background:var(--paper);color:var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.38)}
.paper-h{display:flex;align-items:center;gap:10px;background:var(--head);color:#fff;padding:9px 10px 9px 14px}
.paper-h b{font-size:17px;font-weight:500;flex:1;letter-spacing:.2px;min-width:0}
.zoom{display:flex;gap:6px}
.zoom button{min-width:34px;height:34px;padding:0 8px;border-radius:9px;background:rgba(255,255,255,.14);font-size:19px;font-weight:700;line-height:1}
.zoom button.txt{font-size:12.5px;font-weight:700}
.xs{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 0 4px}
table.mt{border-collapse:separate;border-spacing:0;table-layout:fixed;width:calc(var(--lbl) + 37 * var(--cell));margin:0 0 10px}
table.mt th,table.mt td{width:var(--cell);min-width:var(--cell);max-width:var(--cell);padding:0;text-align:center}
table.mt .lbl{position:sticky;left:0;z-index:3;width:var(--lbl);min-width:var(--lbl);max-width:var(--lbl);border-right:3px solid var(--paper)}
table.mt .mon{background:var(--head);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:-.1px;overflow:hidden;white-space:nowrap}
table.mt .mon.lg{font-size:11px;letter-spacing:-.3px}
table.mt .crew{background:#e4e7eb;color:#2b3340;font-weight:800;font-size:14px;border-bottom:1px solid var(--paper)}
table.mt .crew.me{background:var(--accent);color:var(--accent-i)}
table.mt .dow{background:var(--hgray);font-size:max(10px,calc(var(--cell) * .38));font-weight:600;color:#3a414c;height:22px}
table.mt .dow.we{background:var(--hgray2)}
table.mt .num{background:#fff;font-size:max(10px,calc(var(--cell) * .4));font-weight:700;color:#2b3340;height:24px;font-variant-numeric:tabular-nums}
table.mt .num.tn span{display:inline-grid;place-items:center;min-width:21px;height:21px;border-radius:99px;background:var(--today);color:#fff;padding:0 3px}
table.mt td{height:calc(var(--cell) + 3px);background:#fff;border-bottom:1px solid #eceef1}
table.mt td.we{background:#f7f8fa}
table.mt td .k{width:calc(var(--cell) - 4px);height:calc(var(--cell) - 3px);font-size:max(9px,calc(var(--cell) * .42));border-radius:5px}
table.mt td .vac{font-size:max(8px,calc(var(--cell) * .32))}
table.mt td.x{background:#fafbfc}
table.mt td.today{background:#ffe3ea}
table.mt td.today .k{box-shadow:0 0 0 2px var(--today)}
table.mt td[data-act]{cursor:pointer}

/* mi guardia */
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead .t{flex:1;text-align:center;font-size:19px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dw{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal .d{position:relative;aspect-ratio:1/1.12;max-width:100%;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;min-width:0;overflow:hidden}
.cal .d .code{font-size:19px;line-height:1}
.cal .d .nm{position:absolute;top:3px;left:6px;font-size:10.5px;font-weight:700;opacity:.72}
.cal .d.vac .code{font-size:14px}
.cal .d .sn,.cal .d .sno{display:none}
.cal .d.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;font-weight:700}

/* ajustes */
.field{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.field:first-of-type{border-top:0}
.field>label{flex:1;font-weight:600;min-width:70px}
.field .k{width:30px;height:28px;font-size:13px;flex:none}
input[type=date],input[type=time],input[type=text],textarea{background:#0f1a2b;border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--text);color-scheme:dark;min-width:0;max-width:100%}
input[type=time]{width:112px}
textarea{width:100%;min-height:84px;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:vertical}
.pat{display:flex;flex-wrap:wrap;gap:4px}
.pat .k{width:31px;height:31px;font-size:14px;border-radius:7px}
.ovl{max-height:300px;overflow:auto;margin:0 -2px}
.ovi{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:13.5px}
.ovi:first-child{border-top:0}
.ovi .k{width:34px;height:28px;font-size:12px;flex:none}
.ovi .vac{font-size:11px}
.ro .shared{opacity:.5;pointer-events:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* navegación: abajo en celular, arriba en PC */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(5,11,22,.96);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;color:var(--muted);font-weight:600}
.tab svg{width:22px;height:22px;padding:3px 14px;box-sizing:content-box;border-radius:14px;transition:background .15s}
.tab.on{color:#fff}.tab.on svg{background:rgba(90,169,255,.24);color:var(--accent)}

/* hoja de edición */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .bgd{position:absolute;inset:0;background:rgba(0,0,0,.58);animation:fade .15s}
.sheet .pnl{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:#0d1727;border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.shh{display:flex;align-items:center;gap:12px}
.shh b{display:block;font-size:18px}
.shh span{font-size:13px;color:var(--muted)}
.shb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 2px;font-size:14px}
.shb .k{width:32px;height:26px;font-size:13px}
.mod{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--warn);background:rgba(255,207,107,.14);padding:3px 8px;border-radius:99px}
.lab{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.codes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.codes button{height:54px;border-radius:12px;font-size:17px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;border:2px solid transparent}
.codes button small{font-size:10px;font-weight:700;opacity:.8}
.codes button.sel{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.swap{display:flex;gap:8px}
.swap button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:16px}
.swap .k{width:30px;height:24px;font-size:12px}
.swap .vac{font-size:10px}
.pnl input[type=text],.pnl input[type=date]{width:100%}
.pnl textarea{min-height:220px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1}

.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);background:var(--text);color:#0b1626;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.deskonly{display:none}
@media (max-width:899px){#syncTxt{display:none}.sync{padding:6px}}

@media (hover:hover){
  .btn:hover,.ibtn:hover,.chip:hover,.mchip:hover,.swap button:hover{filter:brightness(1.18)}
  .srow:hover{background:rgba(255,255,255,.11)}
  .srow.me:hover{background:rgba(90,169,255,.2)}
  table.mt td[data-act]:hover .k,.wk:hover .k,.sday:hover .k,.cal .d:hover{filter:brightness(1.08);box-shadow:0 0 0 2px var(--accent)}
}

/* ---------- PC y tablet ---------- */
@media (min-width:900px){
  .appbar{padding:12px 24px;gap:14px}
  .brand h1{font-size:20px}
  .sync{margin-left:16px}
  .tabbar{position:static;margin-left:auto;padding:0;background:none;border:0;gap:4px;flex:none}
  .tab{flex:none;flex-direction:row;gap:8px;padding:9px 14px;border-radius:12px;font-size:14px}
  .tab svg{width:20px;height:20px;padding:0;background:none!important}
  .tab.on{background:rgba(90,169,255,.2);color:#fff}
  .tab.on svg{color:var(--accent)}
  .tab:hover{color:#fff;background:rgba(255,255,255,.07)}
  main{max-width:1240px;padding:22px 24px 40px}
  main.wide{max-width:1600px}
  .cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
  .col{gap:16px}
  .mia{display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-areas:"crew cal" "sum cal";grid-template-rows:auto 1fr;gap:16px;align-items:start}
  .a-crew{grid-area:crew}.a-cal{grid-area:cal}.a-sum{grid-area:sum}
  .cal{gap:7px}

}

<script>
(function(){
'use strict';
var KEY='turnos-ctmm-v1';
var IS_APP=!!window.AndroidBridge;
var CREWS=['A','B','C','D'];
var DOW=['Do','Lu','Ma','Mi','Ju','Vi','Sa'];
var DOWL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DOWS=['dom','lun','mar','mié','jue','vie','sáb'];
var MON=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var NAME={M:'Mañana',T:'Tarde',N:'Noche',F:'Franco'};
var CODES=['M','T','N','F','MV','TV','NV','FV'];
var ORDER={M:0,T:1,N:2,F:3,MV:4,TV:5,NV:6,FV:7};
// Planilla original: ciclo de 28 días (7 N, 2 F, 7 T, 2 F, 7 M, 3 F); día 1 = primer día de Noche
var DEF={v:1,pattern:'NNNNNNNFFTTTTTTTFFMMMMMMMFFF',
  anchors:{A:'2026-06-29',B:'2026-07-13',C:'2026-07-06',D:'2026-07-20'},
  hours:{M:['06:00','14:00'],T:['14:00','22:00'],N:['22:00','06:00']},
  myCrew:'',overrides:{},zoom:null};
var IC={
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- utilidades ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function mod(a,b){return ((a%b)+b)%b}
var DAY=864e5;
function dn(y,m,d){return Math.round(Date.UTC(y,m,d)/DAY)}
function fromDn(n){var t=new Date(n*DAY);return {y:t.getUTCFullYear(),m:t.getUTCMonth(),d:t.getUTCDate(),w:t.getUTCDay()}}
function isoOf(n){var o=fromDn(n);return o.y+'-'+pad(o.m+1)+'-'+pad(o.d)}
function parseIso(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?dn(+m[1],+m[2]-1,+m[3]):null}
function todayDn(){var t=new Date();return dn(t.getFullYear(),t.getMonth(),t.getDate())}
function toMin(s){var m=/^(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):0}
function dayShort(n){var o=fromDn(n);return DOWS[o.w]+' '+pad(o.d)+'/'+pad(o.m+1)}
function dayLong(n){var o=fromDn(n);return DOWL[o.w]+' '+o.d+' de '+MON[o.m].toLowerCase()+' de '+o.y}
function inDays(d){return d===0?'hoy':d===1?'mañana':'en '+d+' días'}
function fmtDur(min){var h=Math.floor(min/60),m=min%60;return ((h?h+' h ':'')+(m||!h?m+' min':'')).trim()}

/* ---------- datos ---------- */
// Valida un estado compartido (cronograma) venido de un respaldo o de la nube.
function cleanShared(p){
  if(!p||typeof p!=='object'||!/^[MTNF]{1,84}$/.test(p.pattern||'')||!p.anchors)return null;
  var out={pattern:p.pattern,anchors:{},hours:clone(DEF.hours),overrides:{}};
  for(var i=0;i<CREWS.length;i++){var c=CREWS[i];if(parseIso(p.anchors[c])==null)return null;out.anchors[c]=p.anchors[c]}
  if(p.hours)['M','T','N'].forEach(function(L){var h=p.hours[L];if(h&&h.length===2&&/^\d{2}:\d{2}$/.test(h[0])&&/^\d{2}:\d{2}$/.test(h[1]))out.hours[L]=[h[0],h[1]]});
  var ov=p.overrides||{};
  Object.keys(ov).forEach(function(k){var v=ov[k];if(/^\d{4}-\d{2}-\d{2}\|[ABCD]$/.test(k)&&v&&CODES.indexOf(v.code)>=0)out.overrides[k]={code:v.code,note:String(v.note||'').slice(0,80)}});
  return out;
}
function sharedOf(o){return {v:1,pattern:o.pattern,anchors:o.anchors,hours:o.hours,overrides:o.overrides}}
function applyShared(p){var c=cleanShared(p);if(!c)return false;S.pattern=c.pattern;S.anchors=c.anchors;S.hours=c.hours;S.overrides=c.overrides;return true}
function load(){
  var raw=null,s=clone(DEF);
  try{raw=IS_APP?AndroidBridge.load():localStorage.getItem(KEY)}catch(e){}
  if(raw){try{var p=JSON.parse(raw),c=cleanShared(p);
    if(c){s.pattern=c.pattern;s.anchors=c.anchors;s.hours=c.hours;s.overrides=c.overrides}
    if(CREWS.indexOf(p.myCrew)>=0)s.myCrew=p.myCrew;
    if(p.zoom>=20&&p.zoom<=48)s.zoom=p.zoom;
  }catch(e){}}
  return s;
}
function persistLocal(){
  var raw=JSON.stringify(S);
  try{if(IS_APP){AndroidBridge.save(raw);return}}catch(e){}
  try{localStorage.setItem(KEY,raw)}catch(e){}
}
function save(){persistLocal();pushCloud()}      // cambios del cronograma
function savePrefs(){persistLocal()}             // mi guardia, tamaño: solo en este dispositivo
var S=load();

/* ---------- nube (versión web): cronograma compartido entre PC y celular ---------- */
var cloud={ref:null,ro:false,busy:false,want:null,last:null,remote:null,state:IS_APP?'app':'local',dl:null,retried:false,dirty:false};
var SYNC_TXT={local:'Guardado en este navegador',loading:'Conectando…',ok:'Sincronizado',saving:'Guardando…',ro:'Solo lectura',err:'Sin sincronizar'};
function setSync(st){
  cloud.state=st;
  var el=$('#sync');if(!el||IS_APP)return;
  el.hidden=false;el.className='sync '+st;$('#syncTxt').textContent=SYNC_TXT[st]||'';
  var info=$('#syncInfo');if(info)info.innerHTML=syncInfoHtml();
}
function initCloud(){
  if(IS_APP||!window.claude||typeof window.claude.use!=='function'){if(!IS_APP)setSync('local');return}
  setSync('local');
  window.claude.use('downloads').then(function(d){cloud.dl=d}).catch(function(){});
  window.claude.use('db').then(function(db){
    if(!db)return;
    cloud.ref=db.doc('turnos/estado');setSync('loading');
    window.claude.use('user').then(function(u){
      if(!u)return;
      return u.can('data.write').then(function(c){if(c===false){cloud.ro=true;setSync(cloud.state==='loading'?'loading':'ro');render()}});
    }).catch(function(){});
    cloud.ref.onSnapshot(onRemote,function(){setSync('err')});
  }).catch(function(){});
}
function onRemote(snap){
  if(!snap.exists){
    setSync(cloud.ro?'ro':'ok');
    // primera vez: si este navegador ya tenía cambios, se suben
    if(!cloud.ro&&JSON.stringify(sharedOf(S))!==JSON.stringify(sharedOf(DEF)))pushCloud();
    return;
  }
  cloud.remote=snap.data();
  if(cloud.busy||cloud.want)return;      // hay una escritura propia en curso
  if(applyShared(clone(cloud.remote))){
    cloud.last=JSON.stringify(sharedOf(S));persistLocal();
    setSync(cloud.ro?'ro':'ok');
    if(sh)cloud.dirty=true;else render();
  }
}
function pushCloud(){
  if(!cloud.ref||cloud.ro)return;
  var body=clone(sharedOf(S));
  if(JSON.stringify(body)===cloud.last&&!cloud.busy)return;
  cloud.want=body;if(!cloud.busy)flush();
}
function flush(){
  var body=cloud.want;cloud.want=null;if(!body)return;
  cloud.busy=true;setSync('saving');
  var str=JSON.stringify(body);
  cloud.ref.set(body).then(function(){cloud.last=str;cloud.retried=false;next(cloud.ro?'ro':'ok')},function(e){
    var code=(e&&e.code)||'unavailable';
    if(code==='unavailable'&&!cloud.retried){cloud.retried=true;cloud.want=cloud.want||body;cloud.busy=false;setTimeout(flush,800+Math.random()*1200);return}
    if(code==='invalid_argument'&&str.length<250000){
      cloud.ro=true;toast('Este cronograma es de solo lectura para vos: los cambios no se guardaron');
      if(cloud.remote)applyShared(clone(cloud.remote));else applyShared(clone(DEF));
      persistLocal();cloud.want=null;cloud.busy=false;setSync('ro');render();return;
    }
    toast(code==='quota_exceeded'||code==='invalid_argument'?'Hay demasiados días modificados: borrá algunos en Ajustes':'No se pudo sincronizar. El cambio quedó guardado en este navegador.');
    next('err');
  });
  function next(st){cloud.busy=false;if(cloud.want)flush();else setSync(st)}
}
function canMod(){if(cloud.ro){toast('Este cronograma es de solo lectura para vos');return false}return true}
function syncInfoHtml(){
  if(cloud.state==='local')return 'Los cambios se guardan <b>solo en este navegador</b>. Usá <b>Respaldo</b> para pasarlos a otra PC o a la app del celular.';
  if(cloud.ro)return 'Estás viendo un cronograma compartido en <b>solo lectura</b>. Tu guardia y el tamaño del cronograma sí se recuerdan en este navegador.';
  return 'Los cambios del cronograma (días modificados, vacaciones, patrón y horarios) se guardan en la nube de esta página y se ven igual desde cualquier PC o celular donde la abras. <b>Tu guardia</b> y el tamaño se recuerdan en cada navegador. Estado: <b>'+(SYNC_TXT[cloud.state]||'')+'</b>.';
}

/* ---------- lógica de turnos ---------- */
function baseCode(c,n){return S.pattern.charAt(mod(n-parseIso(S.anchors[c]),S.pattern.length))}
function ovKey(c,n){return isoOf(n)+'|'+c}
function getOv(c,n){return S.overrides[ovKey(c,n)]}
function codeOf(c,n){var o=getOv(c,n);return (o&&o.code)||baseCode(c,n)}
function isWork(k){return k.length===1&&k!=='F'}
function codeName(k){return k.length>1?'Vacaciones':NAME[k]}
function dur(L){var a=toMin(S.hours[L][0]),b=toMin(S.hours[L][1]),d=b-a;return d<=0?d+1440:d}
function hoursLabel(k){
  if(k.length>1)return 'Vacaciones (le tocaba '+NAME[k[0]].toLowerCase()+')';
  if(k==='F')return 'Día libre';
  return S.hours[k][0]+' a '+S.hours[k][1]+' h';
}
function shortHours(k){return isWork(k)?S.hours[k][0].replace(':00','')+'–'+S.hours[k][1].replace(':00',''):(k.length>1?'Vacaciones':'Libre')}
function tile(k,ov,cls){return '<span class="k c-'+k[0]+(k.length>1?' vac':'')+(ov?' ov':'')+(cls?' '+cls:'')+'">'+k+'</span>'}
function setCode(c,n,k,note){
  var key=ovKey(c,n);
  if(k===baseCode(c,n)&&!note)delete S.overrides[key];
  else S.overrides[key]={code:k,note:note||''};
}
function activeNow(){
  var now=new Date(),t=todayDn(),nm=now.getHours()*60+now.getMinutes(),out=[];
  CREWS.forEach(function(c){[t-1,t].forEach(function(x){
    var k=codeOf(c,x);if(!isWork(k))return;
    var st=(x-t)*1440+toMin(S.hours[k][0]),en=st+dur(k);
    if(nm>=st&&nm<en)out.push({c:c,k:k,rem:en-nm});
  })});
  return out;
}
function coverageIssues(){
  var t=todayDn(),bad=0;
  for(var i=0;i<S.pattern.length;i++){
    var set={};CREWS.forEach(function(c){set[baseCode(c,t+i)]=1});
    if(!(set.M&&set.T&&set.N))bad++;
  }
  return bad;
}
function legend(){
  return '<div class="legend">'+['M','T','N','F'].map(function(L){return '<span>'+tile(L)+NAME[L]+'</span>'}).join('')+
    '<span>'+tile('MV')+tile('TV')+tile('NV')+tile('FV')+'Vacaciones</span><span>'+tile('M',true)+'Día modificado</span></div>';
}

/* ---------- estado de interfaz ---------- */
var T0=todayDn(),o0=fromDn(T0);
var ui={tab:'hoy',hoyDn:T0,year:o0.y,miaCrew:S.myCrew||'A',miaY:o0.y,miaM:o0.m,jump:true};
var sh=null;

function show(tab){
  ui.tab=tab;
  document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id==='v-'+tab)});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
  $('#main').classList.toggle('wide',tab==='crono');
  if(tab==='crono')ui.jump=true;
  window.scrollTo(0,0);
  render();
}
function render(){({hoy:renderHoy,crono:renderCrono,mia:renderMia,aj:renderAj})[ui.tab]()}

/* ---------- HOY ---------- */
function renderHoy(){
  var n=ui.hoyDn,t=todayDn(),o=fromDn(n),L='',R='';
  if(!S.myCrew){
    L+='<div class="card"><h2>¿Cuál es tu guardia?</h2><div class="chips">'+CREWS.map(function(c){return '<button class="chip" data-act="setMine" data-c="'+c+'">'+c+'</button>'}).join('')+
       '</div><p class="note">La vas a ver resaltada en todo el cronograma. Se puede cambiar en Ajustes.</p></div>';
  }
  L+='<div class="card"><div class="datenav"><button class="ibtn" data-act="hoyPrev" aria-label="Día anterior">'+IC.left+'</button><div class="mid">'+
     '<div class="dname">'+DOWL[o.w]+'</div><label class="pick"><span class="dfull">'+o.d+' de '+MON[o.m].toLowerCase()+' '+o.y+'</span><input type="date" id="hoyPick" value="'+isoOf(n)+'" aria-label="Elegir fecha"></label><br>'+
     (n===t?'<span class="ttag">HOY</span>':'<button class="ttag" data-act="hoyToday">VOLVER A HOY</button>')+
     '</div><button class="ibtn" data-act="hoyNext" aria-label="Día siguiente">'+IC.right+'</button></div>'+
     '<p class="note deskonly" style="text-align:center;margin-top:10px">Con el teclado: <span class="kbd">←</span> <span class="kbd">→</span> cambian de día · <span class="kbd">H</span> vuelve a hoy</p></div>';
  if(n===t){
    activeNow().forEach(function(a){
      L+='<div class="card nowc"><span class="pulse"></span><div class="inf"><small>EN TURNO AHORA</small><b>Guardia '+a.c+' · '+NAME[a.k]+'</b><span class="s">'+S.hours[a.k][0]+' a '+S.hours[a.k][1]+' h · termina en '+fmtDur(a.rem)+'</span></div><div class="crewc">'+a.c+'</div></div>';
    });
  }
  var rows=CREWS.map(function(c){return {c:c,k:codeOf(c,n),ov:getOv(c,n)}}).sort(function(a,b){return ORDER[a.k]-ORDER[b.k]});
  L+='<div class="card"><h2>Turnos del día</h2>'+rows.map(function(r){
    var me=r.c===S.myCrew;
    return '<button class="srow'+(me?' me':'')+'" data-act="edit" data-c="'+r.c+'" data-n="'+n+'">'+tile(r.k,!!r.ov)+
      '<div class="inf"><b>'+codeName(r.k)+'</b><span>'+hoursLabel(r.k)+(r.ov&&r.ov.note?' · '+esc(r.ov.note):'')+'</span>'+(me?'<span class="tagme">Tu guardia</span>':'')+'</div><div class="crewc">'+r.c+'</div></button>';
  }).join('')+'</div>';
  if(S.myCrew){
    var c=S.myCrew,strip='';
    for(var x=n;x<n+14;x++){var oo=fromDn(x);strip+='<button class="sday'+(x===t?' t':'')+'" data-act="edit" data-c="'+c+'" data-n="'+x+'"><small>'+DOW[oo.w]+' '+oo.d+'</small>'+tile(codeOf(c,x),!!getOv(c,x))+'</button>'}
    var k=codeOf(c,n),f1,f2,y;
    if(isWork(k)){
      y=n+1;while(y<n+400&&isWork(codeOf(c,y)))y++;
      f1=['Próximo franco',dayShort(y),inDays(y-n)];
      y=n+1;while(y<n+400&&!(isWork(codeOf(c,y))&&codeOf(c,y)!==k))y++;
      f2=['Pasás a '+NAME[codeOf(c,y)].toLowerCase(),dayShort(y),inDays(y-n)];
    }else{
      y=n+1;while(y<n+400&&!isWork(codeOf(c,y)))y++;
      f1=['Volvés a trabajar',dayShort(y),NAME[codeOf(c,y)]+' · '+inDays(y-n)];
      f2=['Días libres que quedan',String(y-n),y-n===1?'incluye este día':'contando este día'];
    }
    R+='<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Tu guardia · '+c+'</h2><span class="sp"></span><span class="mut sm">próximos 14 días</span></div><div class="strip">'+strip+'</div>'+
       '<div class="facts">'+[f1,f2].map(function(f){return '<div class="fact"><small>'+f[0]+'</small><b>'+f[1]+'</b><span>'+f[2]+'</span></div>'}).join('')+'</div></div>';
  }
  R+=weekCard(n);

/* ---------- CRONOGRAMA (plantilla) ---------- */
function getCell(){
  if(S.zoom)return S.zoom;
  var p=$('#v-crono .paper'),w=p&&p.clientWidth?p.clientWidth:Math.min(window.innerWidth,1600)-48;
  return Math.max(28,Math.min(42,Math.floor((w-lblW()-4)/37)));
}
function lblW(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lbl'))||66}
function applyZoom(){document.documentElement.style.setProperty('--cell',getCell()+'px')}
function setZoom(z){
  var xs=$('#v-crono .xs'),cur=getCell(),ratio=xs?(xs.scrollLeft/cur):0;
  S.zoom=z==null?null:Math.max(20,Math.min(48,z));savePrefs();applyZoom();
  if(xs)xs.scrollLeft=ratio*getCell();
  var f=$('#zFit');if(f)f.hidden=!S.zoom;
}
function monthTable(Y,m,t){
  var first=dn(Y,m,1),w0=fromDn(first).w,nd=dn(Y,m+1,1)-first,c,w,d,we,x;
  var r1='<tr><th class="lbl mon cond'+(MON[m].length>8?' lg':'')+'" rowspan="2">'+MON[m]+'</th>',r2='<tr>',rows='';
  for(c=0;c<37;c++){
    w=c%7;d=c-w0+1;we=(w===0||w===6)?' we':'';
    r1+='<th class="dow'+we+'">'+DOW[w]+'</th>';
    r2+=(d>=1&&d<=nd)?'<th class="num'+((first+d-1)===t?' tn':'')+'"><span>'+d+'</span></th>':'<th class="num"></th>';
  }
  CREWS.forEach(function(cr){
    rows+='<tr><th class="lbl crew'+(cr===S.myCrew?' me':'')+'">'+cr+'</th>';
    for(var cc=0;cc<37;cc++){
      var dd=cc-w0+1,ww=cc%7;
      if(dd<1||dd>nd){rows+='<td class="x"></td>';continue}
      x=first+dd-1;var ov=getOv(cr,x);
      rows+='<td data-act="edit" data-c="'+cr+'" data-n="'+x+'" class="'+(x===t?'today':(ww===0||ww===6?'we':''))+'"'+(ov&&ov.note?' title="'+esc(ov.note)+'"':'')+'>'+tile(codeOf(cr,x),!!ov)+'</td>';
    }
    rows+='</tr>';
  });
  return '<table class="mt" id="mt'+m+'">'+r1+'</tr>'+r2+'</tr>'+rows+'</table>';
}
function renderCrono(){
  var Y=ui.year,t=todayDn(),to=fromDn(t),el=$('#v-crono');
  var old=el.querySelector('.xs'),keepX=old?old.scrollLeft:0;
  var h='<div class="card"><div class="yearbar"><span class="ylab">Actualizar año</span><div class="yearbox"><button data-act="yPrev" aria-label="Año anterior">'+IC.left+'</button><b>'+Y+'</b><button data-act="yNext" aria-label="Año siguiente">'+IC.right+'</button></div><span class="sp"></span><button class="btn sm" data-act="yToday">Ir a hoy</button></div>'+legend()+'</div>';
  h+='<div class="monthbar">'+MON.map(function(mn,i){return '<button class="mchip'+(Y===to.y&&i===to.m?' cur':'')+'" data-act="mJump" data-m="'+i+'">'+mn+'</button>'}).join('')+'</div>';
  h+='<div class="paper"><div class="paper-h"><b>Calendario de Turnos '+Y+'</b><div class="zoom"><button class="txt" id="zFit" data-act="zFit"'+(S.zoom?'':' hidden')+'>Ajustar</button><button data-act="zOut" aria-label="Achicar">−</button><button data-act="zIn" aria-label="Agrandar">+</button></div></div><div class="xs">';
  for(var m=0;m<12;m++)h+=monthTable(Y,m,t);
  h+='</div></div><p class="hint">Tocá un casillero para modificar el turno. Si no entra el mes completo, deslizá hacia los costados o achicá con −.</p>';

function jumpMonth(m,toToday,instant){
  var tb=$('#mt'+m),xs=$('#v-crono .xs');if(!tb)return;
  var cell=getCell(),lbl=lblW();
  if(toToday){var td=tb.querySelector('td.today');if(td)xs.scrollLeft=Math.max(0,td.offsetLeft-lbl-cell*3)}
  else{var w0=fromDn(dn(ui.year,m,1)).w;xs.scrollLeft=Math.max(0,w0*cell-cell)}

function backupText(){return JSON.stringify({app:'turnos-ctmm',v:1,exportado:isoOf(todayDn()),pattern:S.pattern,anchors:S.anchors,hours:S.hours,myCrew:S.myCrew,overrides:S.overrides})}

function closeSheet(){sh=null;$('#sheet').classList.remove('on');if(cloud.dirty){cloud.dirty=false;render()}}
function shDays(){
  var u=parseIso($('#shUntil').value),a=sh.n,b=(u==null?sh.n:u),out=[];
  if(b<a){var tmp=a;a=b;b=tmp}
  if(b-a>400)b=a+400;
  for(var x=a;x<=b;x++)out.push(x);
  return out;
}
function done(msg){save();sh=null;$('#sheet').classList.remove('on');cloud.dirty=false;render();toast(msg)}

    cloud.dl.save({filename:sh.filename,data:sh.text}).then(function(){toast('Archivo descargado')},function(e){
      var code=e&&e.code;if(code==='declined')return;
      toast(code==='rate_limited'?'Esperá un momento y probá de nuevo':'No se pudo descargar: usá Copiar');
    });
  },
  pat:function(b){if(!canMod())return;var i=+b.dataset.i,nx={M:'T',T:'N',N:'F',F:'M'};S.pattern=S.pattern.slice(0,i)+nx[S.pattern[i]]+S.pattern.slice(i+1);save();renderAj()},
  patAdd:function(){if(!canMod())return;if(S.pattern.length<84){S.pattern+='F';save();renderAj()}},
  patDel:function(){if(!canMod())return;if(S.pattern.length>1){S.pattern=S.pattern.slice(0,-1);save();renderAj()}},
  patReset:function(){if(!canMod())return;S.pattern=DEF.pattern;save();renderAj();toast('Patrón de la planilla restaurado')},
  anc:function(b){if(!canMod())return;var c=b.dataset.c;S.anchors[c]=isoOf(parseIso(S.anchors[c])+(+b.dataset.d));save();renderAj();toast('Guardia '+c+' corrida '+(+b.dataset.d>0?'+1':'−1')+' día')},
  delOv:function(b){if(!canMod())return;delete S.overrides[b.dataset.k];save();renderAj()},
  clearOv:function(b){if(!canMod())return;confirm2(b,function(){S.overrides={};save();renderAj();toast('Cambios borrados')})},
  resetAll:function(b){if(!canMod())return;confirm2(b,function(){var d=clone(DEF);S.pattern=d.pattern;S.anchors=d.anchors;S.hours=d.hours;S.overrides={};save();renderAj();toast('Cronograma restaurado')})},
  bkShare:function(){exportText(backupText(),'Respaldo Turnos CTMM','turnos-ctmm-respaldo-'+isoOf(todayDn())+'.json')},
  bkImport:function(){importText($('#bkIn').value)}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var f=ACT[b.dataset.act];if(f){e.preventDefault();f(b)}
});
document.addEventListener('change',function(e){
  var x=e.target;
  if(x.id==='hoyPick'){var n=parseIso(x.value);if(n!=null){ui.hoyDn=n;renderHoy()}}
  else if(x.id==='bkFile'&&x.files&&x.files[0]){
    var r=new FileReader();r.onload=function(){importText(r.result)};r.onerror=function(){toast('No se pudo leer el archivo')};r.readAsText(x.files[0]);x.value='';
  }
  else if(x.dataset.h){if(!canMod()){renderAj();return}if(/^\d{2}:\d{2}/.test(x.value)){S.hours[x.dataset.h][+x.dataset.i]=x.value.slice(0,5);save();toast('Horario guardado')}}
  else if(x.dataset.anchor){if(!canMod()){renderAj();return}if(parseIso(x.value)!=null){S.anchors[x.dataset.anchor]=x.value;save();renderAj();toast('Inicio de ciclo actualizado')}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sh){closeSheet();return}
  var tg=e.target&&e.target.tagName;
  if(sh||e.ctrlKey||e.metaKey||e.altKey||tg==='INPUT'||tg==='TEXTAREA')return;
  if(ui.tab==='hoy'){
    if(e.key==='ArrowLeft'){ui.hoyDn--;renderHoy()}else if(e.key==='ArrowRight'){ui.hoyDn++;renderHoy()}
    else if(e.key==='h'||e.key==='H'){ui.hoyDn=todayDn();renderHoy()}
  }else if(ui.tab==='mia'){
    if(e.key==='ArrowLeft')miaMove(-1);else if(e.key==='ArrowRight')miaMove(1);
  }
});
var rz;
window.addEventListener('resize',function(){if(S.zoom)return;clearTimeout(rz);rz=setTimeout(applyZoom,120)});

var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2400)}

/* botón atrás de Android */
window.onAndroidBack=function(){
  if(sh){closeSheet();return true}
  if(ui.tab!=='hoy'){show('hoy');return true}
  return false;
};

/* refresco: cambio de día y "en turno ahora" */
var lastDay=todayDn();
function tick(){
  var t=todayDn();
  if(t!==lastDay){if(ui.hoyDn===lastDay)ui.hoyDn=t;lastDay=t;if(!sh)render()}
  else if(ui.tab==='hoy'&&!sh&&ui.hoyDn===t)renderHoy();
}
setInterval(tick,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});

render();
initCloud();
})();
</script>

</body>
</html>
